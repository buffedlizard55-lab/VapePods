name: Rebuild + validate VapePods data

# This repo's GitHub Pages is published by the repository's own "pages build and
# deployment" flow from the main branch (Pages → Deploy from a branch → main / root).
# That flow serves index.html at the site root, which is generated by build/build.py
# together with site/. So this workflow does NOT deploy: it rebuilds the data from
# the source of truth, fails the build if the data or the page is broken, and proves
# on every push that build/build.py still reproduces site/data.js exactly.
#
# (A previous version of this file had `runs-on: ubuntu-later`, which is not a valid
# runner label, so it could never run at all. Fixed 2026-09-15.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild data from build/build.py
        run: |
          python3 build/build.py
          echo "---- generated ----"
          ls -la site/

      - name: Data must be reproducible and complete
        run: |
          git diff --exit-code site/data.js index.html || {
            echo "::error::build/build.py is not reproducible: rerun it and commit the output."
            exit 1
          }
          test -f site/index.html
          test -f site/style.css
          test -f site/app.js
          node -e "
            const fs=require('fs');
            const s=fs.readFileSync('site/data.js','utf8').replace('window.PODS_DATA','globalThis.PODS_DATA');
            eval(s);
            const d=globalThis.PODS_DATA;
            if(!d||!d.entries||!d.entries.length) throw new Error('no entries in data.js');
            const noSrc=d.entries.filter(e=>!e.source_url||!/^https?:\/\//.test(e.source_url));
            if(noSrc.length) throw new Error('entry without an official source link: '+noSrc[0].id);
            const badDate=d.entries.filter(e=>!e.verified_date);
            if(badDate.length) throw new Error('entry without a verification date: '+badDate[0].id);
            console.log('entries:',d.entries.length,'| stores:',d.stores.length,'| flags:',d.flags.length,
                        '| live-verified today:',d.entries.filter(e=>e.verified==='live').length,
                        '| new this pass:',d.entries.filter(e=>e.is_new).length);
          "

      - name: Syntax-check the page scripts
        run: |
          node --check site/app.js && echo "app.js syntax OK"
          node --check site/data.js && echo "data.js syntax OK"
