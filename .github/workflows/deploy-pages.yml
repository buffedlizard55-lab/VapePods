name: Deploy VapePods site to GitHub Pages

on:
  push:
    branches: [arena/01a0a0f6-vapepods]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-later
    steps:
      - uses: actions/checkout@v4

      - name: Build site data
        run: |
          python3 build/build.py
          echo "---- generated files ----"
          ls -la site/
          head -c 400 site/data.js

      - name: Validate site files
        run: |
          test -f site/index.html
          test -f site/style.css
          test -f site/app.js
          test -f site/data.js
          node -e "const fs=require('fs');const s=fs.readFileSync('site/data.js','utf8');eval(s);const d=window.PODS_DATA;throw new Error('bad data') if(!d)" 2>/dev/null || \
          node -e "const fs=require('fs');const s=fs.readFileSync('site/data.js','utf8').replace('window.PODS_DATA','global.PODS_DATA');eval(s);if(!global.PODS_DATA||!global.PODS_DATA.entries.length){process.exit(1)}console.log('entries:',global.PODS_DATA.entries.length,'stores:',global.PODS_DATA.stores.length)"
          node --check site/app.js && echo "app.js syntax OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
